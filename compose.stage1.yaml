name: doclens-stage1
services:
  postgres:
    image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    environment:
      POSTGRES_USER: doclens_dev_admin
      POSTGRES_DB: doclens_service
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin
    secrets:
      - postgres_admin
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doclens_dev_admin -d doclens_service"]
      interval: 2s
      timeout: 3s
      retries: 30
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1@sha256:3f3c5f8e03c614774b4bd9173b88391fefa4153bfc010d8012d59ad825377332
    env_file: .env.stage1.idp.local
    command: ["start-dev", "--import-realm", "--hostname=http://127.0.0.1:18080"]
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - ./data/service/dev/realm.json:/opt/keycloak/data/import/doclens-dev-realm.json:ro
      - keycloak_data:/opt/keycloak/data
    # Local development only. Identity-provider production operations are later.
volumes:
  postgres_data:
  keycloak_data:
secrets:
  postgres_admin:
    file: ./data/service/dev/postgres-admin.txt
