name: doclens-stage1
services:
  postgres:
    # Stage 4: PostgreSQL 18 + pgvector 0.8.7 (Debian bookworm), digest-pinned. Replaces the earlier
    # postgres:18.6-alpine image; an existing alpine-created volume should be recreated (glibc vs musl collations).
    image: pgvector/pgvector:0.8.7-pg18-bookworm@sha256:38681dc6eaf55308e2a4c6de392d131652dcfac70e1263e35cd9b5ea3fe39782
    environment:
      POSTGRES_USER: doclens_dev_admin
      POSTGRES_DB: doclens_service
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin
    secrets:
      - postgres_admin
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doclens_dev_admin -d doclens_service"]
      interval: 2s
      timeout: 3s
      retries: 30
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1@sha256:3f3c5f8e03c614774b4bd9173b88391fefa4153bfc010d8012d59ad825377332
    env_file: .env.stage1.idp.local
    command: ["start-dev", "--import-realm", "--hostname=http://127.0.0.1:18080"]
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - ./data/service/dev/realm.json:/opt/keycloak/data/import/doclens-dev-realm.json:ro
      - keycloak_data:/opt/keycloak/data
    # Local development only. Identity-provider production operations are later.
volumes:
  postgres_data:
  keycloak_data:
secrets:
  postgres_admin:
    file: ./data/service/dev/postgres-admin.txt
