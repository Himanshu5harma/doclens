[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doclens-rag"
version = "0.1.0"
description = "A version-aware RAG assistant for technical documentation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14,<5",
]

[project.scripts]
doclens = "doclens.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
